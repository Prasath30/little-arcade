:root {
  color-scheme: light;
  --paper: #faf0dd;
  --ivory: #fff8e9;
  --ink: #39251d;
  --muted: #675047;
  --red: #a33628;
  --line: #e3cbb1;
  --headline: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "DM Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-width: 300px;
  min-height: 100svh;
  color: var(--ink);
  background: radial-gradient(ellipse at 17% 24%, #fff5dc, transparent 56%),
    repeating-linear-gradient(2deg, #75412a04 0 1px, transparent 1px 6px), var(--paper);
  font: 400 15px/1.5 var(--body);
}
button { font: inherit; cursor: pointer; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, canvas:focus-visible { outline: 3px solid #205c57; outline-offset: 4px; }
.shell { width: min(1220px, calc(100% - clamp(34px, 8.3vw, 126px))); margin-inline: auto; }
.topbar { height: clamp(55px, 8.5vh, 79px); display: flex; justify-content: space-between; align-items: center; gap: 15px; border-bottom: 1px solid var(--line); }
.identity { display: flex; align-items: center; gap: 10px; font: 800 16px var(--headline); letter-spacing: -.035em; }
.mark { width: 34px; height: 32px; flex: none; border-radius: 9px; background: #ad3a2a; color: #fff3d4; display: grid; place-content: center; gap: 3px; box-shadow: inset 0 1px 0 #fff6; }
.mark i { width: 15px; height: 3px; display: block; border-radius: 50%; background: currentColor; }
.mark i:first-child { width: 11px; justify-self: center; }
.offline { display: inline-flex; gap: 7px; align-items: center; font-size: 11px; font-weight: 700; color: #48624c; }
.offline::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #5c7f54; box-shadow: 0 0 0 3px #dbe4ca; }
.intro { display: flex; justify-content: space-between; align-items: end; gap: 20px; padding: clamp(36px, 8.5vh, 98px) 0 clamp(25px, 4.8vh, 55px); }
h1, h2, p { margin: 0; }
.intro h1 { color: var(--red); font: 800 clamp(58px, 9.7vw, 139px)/.82 var(--headline); letter-spacing: -.085em; }
.intro h1 span { color: #68362a; }
.intro p { color: var(--muted); max-width: 195px; margin: 0 5px 1px 0; font-size: clamp(13px, 1.45vw, 17px); line-height: 1.42; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(14px, 2vw, 26px); }
.game-card {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 0;
  padding: 0;
  background: var(--ivory);
  border: 1px solid #d4b99c;
  border-radius: 19px;
  text-align: left;
  overflow: hidden;
  box-shadow: 0 4px 0 #9a603822, 0 12px 25px #74463113;
  transition: transform .18s, box-shadow .18s, border-color .18s;
}
.game-card:hover { transform: translateY(-5px); box-shadow: 0 5px 0 #9a603834, 0 18px 28px #7446311e; border-color: #af8669; }
.game-card:active { transform: translateY(1px); box-shadow: 0 2px 0 #9a603834; }
.cover { width: 100%; display: block; aspect-ratio: 1.39; background: #bdd1b9; border-bottom: 1px solid #b4a18a; }
.game-card[data-game="toast"] .cover { background: #efb59a; }
.game-card[data-game="cookie"] .cover { background: #d8c8df; }
.card-info { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: clamp(13px, 2vw, 23px); width: 100%; }
.card-name { font: 800 clamp(19px, 2.4vw, 34px)/1.04 var(--headline); letter-spacing: -.064em; }
.card-instruction { color: var(--muted); font-size: clamp(11px, 1.1vw, 14px); line-height: 1.35; }
.card-best { color: #4c6a55; font-size: 11px; font-weight: 700; margin-top: 9px; }
.card-best::before { content: "★"; color: #a66933; margin-right: 5px; }
.play-arrow { grid-column: 2; grid-row: 1 / 4; align-self: center; display: grid; place-items: center; width: clamp(30px, 3.8vw, 49px); aspect-ratio: 1; border: 1px solid #e1bf9d; border-radius: 50%; background: #fae9cd; color: #963627; font: 800 22px/1 var(--headline); }
.game-card:hover .play-arrow { background: #ae3c2c; border-color: #ae3c2c; color: #fff1d4; }
.library-tail { display: flex; justify-content: space-between; gap: 10px; margin: 24px 0 20px; padding-top: 14px; border-top: 1px solid var(--line); color: #6e5349; font-size: 11px; }
.pill { min-height: 36px; padding: 5px 13px; border: 1px solid #d2b492; border-radius: 25px; background: var(--ivory); color: #654437; font-weight: 700; font-size: 12px; }
.pill:hover { background: #f1ddbc; }

.play-shell .topbar { height: 63px; }
.play-layout {
  display: grid; grid-template-columns: minmax(208px, .64fr) minmax(0, 1.32fr);
  grid-template-rows: 1fr 1fr; grid-template-areas: "intro board" "controls board";
  column-gap: clamp(20px, 4.1vw, 65px); padding: clamp(25px, 6vh, 56px) 0 24px;
}
.play-copy { grid-area: intro; align-self: end; }
.play-copy h1 { color: var(--red); font: 800 clamp(55px, 7.8vw, 107px)/.84 var(--headline); letter-spacing: -.084em; }
.play-shell[data-game="cookie"] .play-copy h1 { color: #713e69; }
.play-copy p { font-size: clamp(13px, 1.55vw, 17px); line-height: 1.42; color: var(--muted); margin-top: 16px; max-width: 240px; }
.play-actions { grid-area: controls; align-self: start; margin-top: 21px; display: grid; gap: 12px; justify-items: start; }
.action { min-height: 50px; min-width: 174px; padding: 8px 15px; border: 1px solid #853022; border-radius: 12px; background: #af3b2d; box-shadow: 0 4px 0 #7c2e22, inset 0 1px #fff7; color: #fff7e0; font-size: 15px; font-weight: 700; }
.action:hover { background: #bf4a39; }
.action:active { transform: translateY(3px); box-shadow: 0 1px 0 #7c2e22; }
.action:focus-visible { outline-offset: 5px; }
.keys { color: var(--muted); font-size: 11px; }
kbd { padding: 2px 5px; background: #fff8e6; border: 1px solid #d9bf9e; border-bottom-width: 2px; border-radius: 5px; font: 700 9px var(--body); color: #69493b; }
.play-board { grid-area: board; min-width: 0; border: 1px solid #c69d7c; border-radius: 22px; overflow: hidden; background: var(--ivory); box-shadow: 0 12px 25px #8c522a21, 0 3px 0 #96674943; }
.hud { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 clamp(14px, 2vw, 26px); border-bottom: 1px solid #b49f86; }
.stat { display: flex; align-items: baseline; gap: 9px; color: #724d3d; }
.stat b { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; }
.stat output { font: 800 27px/.9 var(--headline); letter-spacing: -.04em; color: #703522; min-width: 1.2em; font-variant-numeric: tabular-nums; }
.stat:last-child output { color: #305d53; }
.stage { height: clamp(335px, calc(100svh - 207px), 565px); position: relative; background: #dfbd99; isolation: isolate; }
#kitchen { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; user-select: none; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 65px #55321e1f; }
.feedback { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); white-space: nowrap; border-radius: 30px; padding: 4px 12px; border: 1px solid #d6b388; background: #fff1c9; color: #6f3429; font: 800 12px var(--headline); pointer-events: none; z-index: 1; }
.end { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; background: #64403b2b; }
.ticket { width: min(250px, 82%); padding: 18px 15px; border: 1px solid #c09770; border-radius: 15px; background: #fff4d9; box-shadow: 0 15px 28px #4e332f33, inset 0 0 0 4px #f5deb4; text-align: center; }
.ticket h2 { color: var(--red); font: 800 clamp(28px, 4.2vw, 42px)/.96 var(--headline); letter-spacing: -.065em; }
.ticket p { margin: 6px 0 10px; color: var(--muted); font-size: 13px; }
.ticket .action { min-height: 39px; min-width: 129px; font-size: 13px; }
#pancake-frame { width: 100%; height: 100svh; display: block; border: 0; }

@media(max-width: 760px) {
  .topbar { height: 48px; }
  .identity { font-size: 14px; gap: 7px; }
  .mark { width: 28px; height: 26px; }
  .intro { padding: 24px 0 19px; align-items: start; flex-direction: column; gap: 8px; }
  .intro h1 { font-size: clamp(48px, 10.25vw, 81px); }
  .intro p { max-width: none; font-size: 12px; }
  .gallery { grid-template-columns: 1fr; gap: 12px; }
  .game-card { display: grid; grid-template-columns: 44% 1fr; border-radius: 13px; }
  .cover { height: clamp(100px, 19vw, 124px); aspect-ratio: auto; border-bottom: 0; border-right: 1px solid #baab91; }
  .card-info { padding: 10px 9px 9px 13px; align-content: center; }
  .card-best { font-size: 10px; margin-top: 3px; }
  .play-arrow { font-size: 17px; }
  .library-tail { margin-top: 16px; padding-top: 10px; font-size: 10px; }
  .play-shell .topbar { height: 44px; }
  .pill { min-height: 30px; font-size: 11px; }
  .play-layout { padding-top: 13px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "intro" "board" "controls"; gap: 10px; }
  .play-copy h1 { font-size: clamp(36px, 9vw, 56px); line-height: 1; }
  .play-copy h1 br { display: none; }
  .play-copy p { font-size: 11px; line-height: 1.36; max-width: none; margin-top: 3px; }
  .play-board { border-radius: 15px; }
  .hud { height: 43px; }
  .stat output { font-size: 22px; }
  .stat b { font-size: 9px; }
  .stage { height: clamp(276px, calc(100svh - 220px), 470px); }
  .play-actions { margin: 0; grid-template-columns: minmax(0, 1fr) auto; align-items: center; justify-items: stretch; gap: 7px; }
  .action { min-height: 40px; min-width: 0; font-size: 13px; }
  .keys { font-size: 10px; white-space: nowrap; }
}
@media(max-width: 365px) { .keys { display: none; } .play-actions { grid-template-columns: 1fr; } .card-name { font-size: 17px; } .play-arrow { width: 24px; } }
@media(prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
</style>
</head>
<body>
<section class="shell" id="arcade">
  <header class="topbar"><div class="identity"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Breakfast Arcade</div><span class="offline">Plays offline</span></header>
  <main>
    <div class="intro"><h1>Pick a <span>game.</span></h1><p>Three kitchen games.<br>One button each.</p></div>
    <div class="gallery">
      <button class="game-card" data-game="pancake" type="button">
        <canvas class="cover" aria-hidden="true"></canvas>
        <span class="card-info"><strong class="card-name">Pancake Tower</strong><span class="card-instruction">Drop pancake onto pancake.</span><span class="card-best" id="best-pancake">Best 00</span><span class="play-arrow" aria-hidden="true">→</span></span>
      </button>
      <button class="game-card" data-game="toast" type="button">
        <canvas class="cover" aria-hidden="true"></canvas>
        <span class="card-info"><strong class="card-name">Toast Rescue</strong><span class="card-instruction">Catch the toast before it lands.</span><span class="card-best" id="best-toast">Best 00</span><span class="play-arrow" aria-hidden="true">→</span></span>
      </button>
      <button class="game-card" data-game="cookie" type="button">
        <canvas class="cover" aria-hidden="true"></canvas>
        <span class="card-info"><strong class="card-name">Cookie Dunk</strong><span class="card-instruction">Drop a cookie into the mug.</span><span class="card-best" id="best-cookie">Best 00</span><span class="play-arrow" aria-hidden="true">→</span></span>
      </button>
    </div>
    <div class="library-tail"><span>Keyboard and touch controls</span><span>Best scores save on this device</span></div>
  </main>
</section>
<section class="shell play-shell" id="play" hidden>
  <header class="topbar">
    <button class="pill" type="button" id="back">← All games</button>
    <button class="pill" type="button" id="sound" aria-pressed="false">♪ Sound off</button>
  </header>
  <main class="play-layout">
    <div class="play-copy"><h1 id="game-title"></h1><p id="game-description"></p></div>
    <div class="play-actions"><button class="action" type="button" id="action"></button><span class="keys"><kbd>SPACE</kbd> or tap</span></div>
    <div class="play-board">
      <div class="hud"><span class="stat"><b id="score-title">Score</b><output id="score">00</output></span><span class="stat"><b>★ Best</b><output id="best">00</output></span></div>
      <div class="stage" id="stage">
        <canvas id="kitchen"></canvas><div class="feedback" id="feedback" aria-hidden="true" hidden></div>
        <div class="end" id="end" hidden><div class="ticket"><h2 id="end-title"></h2><p id="end-score"></p><button type="button" class="action" id="again">Play again</button></div></div>
      </div>
    </div>
  </main>
</section>
<div id="pancake" hidden></div>

\n      --paper: #f9eed9;\n      --cream: #fff7e5;\n      --line: #dfc5a1;\n      --display: \"Bricolage Grotesque\", \"Trebuchet MS\", system-ui, sans-serif;\n      --body: \"DM Sans\", system-ui, sans-serif;\n    }\n    * { box-sizing: border-box; }\n    [hidden] { display: none !important; }\n    body {\n      margin: 0;\n      color: var(--ink);\n      background:\n        radial-gradient(ellipse at 9% 40%, #ffefd0 0, transparent 44%),\n        radial-gradient(ellipse at 90% -10%, #fff7e6 0, transparent 45%),\n        repeating-linear-gradient(2deg, #7d482b04 0 1px, transparent 1px 5px),\n        var(--paper);\n      font: 400 15px/1.5 var(--body);\n      min-height: 100svh;\n    }\n    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }\n    button:focus-visible, [tabindex]:focus-visible { outline: 3px solid #115960; outline-offset: 4px; }\n    .shell { width: min(1260px, calc(100% - clamp(42px, 8vw, 136px))); margin: 0 auto; }\n    header {\n      height: clamp(57px, 8.1vh, 82px);\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      border-bottom: 1px solid var(--line);\n    }\n    .offline { display: flex; align-items: center; gap: 10px; color: var(--red-dark); font-size: 11px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }\n    .mark { flex: none; width: 34px; height: 30px; display: grid; place-content: center; gap: 2px; background: #f4d8ac; border: 1px solid #e8c99d; border-radius: 10px; }\n    .mark i { width: 17px; height: 4px; background: #ab3927; border-radius: 50%; display: block; }\n    .mark i:first-child { width: 13px; justify-self: center; }\n    .sound {\n      min-height: 34px;\n      border: 1px solid #d9ba92;\n      background: #fff7e2;\n      color: #533327;\n      padding: 4px 11px 4px 8px;\n      border-radius: 22px;\n      font-size: 11px;\n      font-weight: 700;\n      display: flex;\n      align-items: center;\n      gap: 6px;\n    }\n    .sound-icon { width: 19px; height: 20px; font: 700 20px/1 var(--display); text-align: center; color: var(--red); }\n    .sound:hover { background: #f5dec0; }\n    .layout {\n      padding: clamp(26px, 5.2vh, 60px) 0 24px;\n      display: grid;\n      grid-template-columns: minmax(260px, .64fr) minmax(0, 1.33fr);\n      grid-template-rows: 1fr 1fr;\n      grid-template-areas: \"intro board\" \"control board\";\n      column-gap: clamp(24px, 4vw, 69px);\n    }\n    .intro { grid-area: intro; align-self: end; padding: 18px 0 0; }\n    h1 {\n      position: relative;\n      width: fit-content;\n      margin: 0;\n      color: var(--red);\n      font-family: var(--display);\n      font-size: clamp(65px, 7.3vw, 121px);\n      line-height: .80;\n      font-weight: 800;\n      letter-spacing: -.092em;\n    }\n    h1 span { display: block; }\n    h1 span:last-child { color: #632c1c; margin-left: -.025em; }\n    .title-accent {\n      width: .36em;\n      height: .39em;\n      position: absolute;\n      left: 2.63em;\n      bottom: .11em;\n      opacity: .9;\n      transform: rotate(10deg);\n    }\n    .title-accent i { position: absolute; display: block; width: 30%; height: 8%; background: #bf712b; border-radius: 100px; transform-origin: left center; }\n    .title-accent i:nth-child(1) { left: 28%; top: 36%; transform: rotate(-61deg); }\n    .title-accent i:nth-child(2) { left: 44%; top: 51%; transform: rotate(-35deg); }\n    .title-accent i:nth-child(3) { left: 44%; top: 67%; transform: rotate(-6deg); }\n    .instructions { margin: 23px 0 0; font-size: clamp(14px, 1.5vw, 18px); color: var(--muted); line-height: 1.55; max-width: 235px; }\n    .instructions strong { color: #533125; font-weight: 700; }\n    .control { grid-area: control; margin-top: 24px; align-self: start; display: grid; justify-items: start; gap: 15px; }\n    .action {\n      min-width: 193px;\n      min-height: 55px;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 10px;\n      color: #fff7df;\n      border: 1px solid #8c2b22;\n      border-radius: 13px;\n      padding: 10px 18px;\n      background: #b3392a;\n      box-shadow: 0 4px 0 #80281e, 0 8px 16px #6732221c, inset 0 1px 0 #ffffff48;\n      font-weight: 700;\n      font-size: 15px;\n      transition: background .15s, transform .13s, box-shadow .13s;\n    }\n    .action:hover { background: #c04735; }\n    .action:active { transform: translateY(3px); box-shadow: 0 1px 0 #80281e, inset 0 1px 0 #ffffff48; }\n    .action .arrow { font-size: 22px; line-height: 1; }\n    .keys { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }\n    kbd { color: #64473a; font: 700 10px var(--body); background: #fff6e2; border: 1px solid #d9bf9e; border-bottom-width: 2px; border-radius: 5px; padding: 2px 6px; }\n    .touch-text { display: none; }\n    .board {\n      grid-area: board;\n      min-width: 0;\n      position: relative;\n      overflow: hidden;\n      border: 1px solid #c99e76;\n      border-radius: 25px;\n      background: #fff7e3;\n      box-shadow: 0 14px 34px #82472123, 0 3px 0 #b6805050;\n    }\n    .hud {\n      height: 68px;\n      padding: 0 clamp(15px, 2.7vw, 33px);\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      border-bottom: 1px solid #b5b9a2;\n    }\n    .stat { display: flex; align-items: baseline; gap: 10px; color: #795443; }\n    .stat-label { font-size: 10px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; }\n    .stat-value { min-width: 1.25em; font: 800 28px/.9 var(--display); color: #6d3220; font-variant-numeric: tabular-nums; letter-spacing: -.054em; }\n    .best .stat-value { color: #275b57; }\n    .best .stat-label::before { content: \"★\"; margin-right: 5px; font-size: 12px; color: #ab6d31; }\n    .stage {\n      position: relative;\n      isolation: isolate;\n      height: clamp(368px, calc(100svh - 245px), 555px);\n      min-width: 0;\n      background: #b7d1c4;\n      user-select: none;\n      overflow: hidden;\n    }\n    #game { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }\n    .stage::after {\n      content: \"\";\n      pointer-events: none;\n      position: absolute;\n      inset: 0;\n      box-shadow: inset 0 1px 0 #ffffff42, inset 0 0 55px #483a1824;\n    }\n    .callout {\n      pointer-events: none;\n      position: absolute;\n      left: 50%;\n      top: 11px;\n      transform: translateX(-50%);\n      min-height: 26px;\n      padding: 4px 12px;\n      border-radius: 50px;\n      color: #214f48;\n      background: #fff6d9;\n      border: 1px solid #8cab91;\n      box-shadow: 0 2px #224d4038;\n      font: 800 12px var(--display);\n      letter-spacing: .055em;\n      white-space: nowrap;\n      z-index: 1;\n    }\n    .callout.glow { color: #7f2d21; border-color: #dfb26a; background: #ffedb9; }\n    .end {\n      position: absolute;\n      inset: 0;\n      display: grid;\n      place-items: center;\n      z-index: 2;\n      background: #3b1d1225;\n      animation: show .20s both;\n    }\n    .ticket {\n      width: min(270px, 82%);\n      padding: 20px 18px 18px;\n      border: 1px solid #b67d50;\n      border-radius: 17px;\n      text-align: center;\n      background: #fff4d9;\n      box-shadow: 0 17px 34px #48241845, inset 0 0 0 4px #f5dfb4;\n    }\n    .ticket h2 { margin: 0; font: 800 clamp(27px, 4.8vw, 43px)/.95 var(--display); letter-spacing: -.075em; color: #a83226; }\n    .ticket p { margin: 9px 0 13px; color: #655043; font-size: 13px; }\n    .ticket .action { min-height: 42px; min-width: 144px; font-size: 13px; border-radius: 9px; }\n    @keyframes show { from { opacity: 0; } to { opacity: 1; } }\n\n    @media (max-width: 760px) {\n      .shell { width: calc(100% - 34px); }\n      header { height: 46px; }\n      .mark { width: 28px; height: 24px; gap: 1px; border-radius: 7px; }\n      .offline { gap: 7px; font-size: 9px; }\n      .sound { min-height: 29px; padding-block: 1px; }\n      .layout {\n        padding-top: 13px;\n        grid-template-columns: minmax(0, 1fr);\n        grid-template-rows: auto;\n        grid-template-areas: \"intro\" \"board\" \"control\";\n        gap: 11px;\n      }\n      .intro { padding: 0; }\n      h1 { font-size: clamp(38px, 8.75vw, 65px); line-height: .99; letter-spacing: -.078em; }\n      h1 span { display: inline; }\n      h1 span:last-child { margin-left: 0; }\n      .title-accent { display: none; }\n      .instructions { margin: 3px 0 0; font-size: 12px; line-height: 1.35; max-width: none; }\n      .board { border-radius: 17px; }\n      .hud { height: 46px; padding: 0 14px; }\n      .stat-value { font-size: 23px; }\n      .stat { gap: 7px; }\n      .stat-label { font-size: 9px; }\n      .stage { height: clamp(315px, calc(100svh - 220px), 500px); }\n      .control { margin-top: 0; grid-template-columns: minmax(0, 1fr) auto; justify-items: stretch; align-items: center; gap: 10px; }\n      .action { min-height: 44px; min-width: 0; padding: 6px 13px; border-radius: 11px; font-size: 14px; }\n      .keys { padding-right: 3px; font-size: 10px; white-space: nowrap; gap: 4px; }\n    }\n    @media (pointer: coarse) {\n      .keyboard-text { display: none; }\n      .touch-text { display: inline; }\n    }\n    @media (max-width: 380px) {\n      .shell { width: calc(100% - 24px); }\n      .instructions { font-size: 11px; }\n      .keys { display: none; }\n      .control { grid-template-columns: 1fr; }\n    }\n    @media (prefers-reduced-motion: reduce) {\n      *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }\n    }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\n  \u003cdiv class=\"shell\">\n    \u003cheader>\n      \u003cbutton class=\"sound\" id=\"arcade-return\" type=\"button\">← All games\u003c/button>\n      \u003cbutton class=\"sound\" id=\"sound\" type=\"button\" aria-pressed=\"false\" aria-label=\"Turn on sound\">\u003cspan class=\"sound-icon\" aria-hidden=\"true\">♪\u003c/span>\u003cspan id=\"sound-text\">Sound off\u003c/span>\u003c/button>\n    \u003c/header>\n    \u003cmain class=\"layout\">\n      \u003csection class=\"intro\" aria-label=\"Pancake Tower\">\n        \u003ch1>\u003cspan>Pancake\u003c/span> \u003cspan>Tower\u003c/span>\u003cb class=\"title-accent\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/b>\u003c/h1>\n        \u003cp class=\"instructions\">\u003cstrong>Time the drop.\u003c/strong> See how high you can stack.\u003c/p>\n      \u003c/section>\n      \u003cdiv class=\"control\">\n        \u003cbutton id=\"action\" class=\"action\" type=\"button\">\u003cspan class=\"arrow\" aria-hidden=\"true\">↓\u003c/span>\u003cspan id=\"action-text\">Drop pancake\u003c/span>\u003c/button>\n        \u003cdiv class=\"keys\">\u003cspan class=\"keyboard-text\">\u003ckbd>SPACE\u003c/kbd> or click the kitchen\u003c/span>\u003cspan class=\"touch-text\">Or tap the kitchen\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003csection class=\"board\" aria-label=\"Pancake Tower game\">\n        \u003cdiv class=\"hud\">\n          \u003cdiv class=\"stat\">\u003cspan class=\"stat-label\">Stack\u003c/span>\u003coutput id=\"score\" class=\"stat-value\">00\u003c/output>\u003c/div>\n          \u003cdiv class=\"stat best\">\u003cspan class=\"stat-label\">Best\u003c/span>\u003coutput id=\"best\" class=\"stat-value\">00\u003c/output>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"stage\" id=\"stage\">\n          \u003ccanvas id=\"game\" aria-label=\"Kitchen game. Press Space or tap to drop a pancake. Stack as many as you can.\">Press Space to stack pancakes. Your browser needs Canvas 2D.\u003c/canvas>\n          \u003cdiv class=\"callout\" id=\"callout\" aria-hidden=\"true\" hidden>\u003c/div>\n          \u003cdiv class=\"end\" id=\"end\" hidden>\n            \u003cdiv class=\"ticket\">\n              \u003ch2 id=\"end-title\">Flop!\u003c/h2>\n              \u003cp id=\"end-score\">\u003c/p>\n              \u003cbutton type=\"button\" id=\"again\" class=\"action\">Play again\u003c/button>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n    \u003c/main>\n  \u003c/div>\n  \u003cscript>\n    'use strict';\n    const get = (id) => document.getElementById(id);\n    const canvas = get('game');\n    const stage = get('stage');\n    const context = canvas.getContext('2d', { alpha: false });\n    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const scoreKey = 'pancake-tower-best-v1';\n    const soundKey = 'breakfast-arcade-sound-v1';\n    const height = 500;\n    const surfaceY = 368;\n    const plateHeight = 10;\n    const cakeHeight = 20;\n    const gravity = 960;\n\n    function read(key) {\n      try { return localStorage.getItem(key); } catch { return null; }\n    }\n\n    function write(key, value) {\n      try { localStorage.setItem(key, String(value)); } catch {}\n    }\n\n    const clamp = (n, low, high) => Math.min(high, Math.max(low, n));\n    const blend = (a, b, amount) => a + (b - a) * amount;\n    const labelScore = (number) => String(number).padStart(2, '0');\n    const game = {\n      mode: 'ready',\n      stack: [],\n      loose: [],\n      crumbs: [],\n      best: Math.max(0, Number(read(scoreKey)) || 0),\n      startingBest: 0,\n      sound: read(soundKey) === 'on',\n      aim: 0,\n      time: 0,\n      endAt: 0,\n      spawnAt: 0,\n      camera: 0,\n      lift: 0,\n      wobble: 0,\n      wobbleAge: 1,\n      streak: 0,\n      flight: null,\n      messageUntil: 0,\n    };\n    let width = 700;\n    let sceneScale = 1;\n    let audio;\n    const screen = document.createElement('canvas');\n    let lastTime = null;\n\n    function refreshScore() {\n      get('score').textContent = labelScore(game.stack.length);\n      get('best').textContent = labelScore(game.best);\n    }\n\n    function refreshSound() {\n      get('sound-text').textContent = game.sound ? 'Sound on' : 'Sound off';\n      get('sound').setAttribute('aria-pressed', String(game.sound));\n      get('sound').setAttribute('aria-label', game.sound ? 'Turn off sound' : 'Turn on sound');\n    }\n\n    function chime(notes, level = .14, shape = 'sine') {\n      if (!game.sound || !audio || audio.state !== 'running') return;\n      const start = audio.currentTime;\n      notes.forEach(([frequency, duration], index) => {\n        const at = start + index * .067;\n        const oscillator = audio.createOscillator();\n        const gain = audio.createGain();\n        oscillator.type = shape;\n        oscillator.frequency.setValueAtTime(frequency, at);\n        if (frequency \u003c 200) oscillator.frequency.exponentialRampToValueAtTime(frequency * .68, at + duration);\n        gain.gain.setValueAtTime(.001, at);\n        gain.gain.exponentialRampToValueAtTime(level, at + .012);\n        gain.gain.exponentialRampToValueAtTime(.001, at + duration);\n        oscillator.connect(gain).connect(audio.destination);\n        oscillator.start(at);\n        oscillator.stop(at + duration + .012);\n      });\n    }\n\n    function initAudio() {\n      if (!game.sound) return;\n      const Audio = window.AudioContext || window.webkitAudioContext;\n      if (!Audio) return;\n      try {\n        audio ||= new Audio();\n        if (audio.state === 'suspended') audio.resume().catch(() => {});\n      } catch {}\n    }\n\n    function callout(message, duration, perfect = false) {\n      const banner = get('callout');\n      banner.textContent = message;\n      banner.classList.toggle('glow', perfect);\n      banner.hidden = false;\n      game.messageUntil = game.time + duration;\n    }\n\n    function reset() {\n      game.mode = 'ready';\n      game.startingBest = game.best;\n      game.stack.length = 0;\n      game.loose.length = 0;\n      game.crumbs.length = 0;\n      game.flight = null;\n      game.aim = .11;\n      game.spawnAt = game.time;\n      game.camera = game.lift = game.wobble = game.streak = 0;\n      game.wobbleAge = 1;\n      get('end').hidden = true;\n      get('callout').hidden = true;\n      get('action-text').textContent = 'Drop pancake';\n      refreshScore();\n    }\n\n    function target() {\n      const last = game.stack.at(-1);\n      return last ? { x: last.x, y: last.y + cakeHeight, radius: last.radius } : { x: 0, y: plateHeight, radius: 89 };\n    }\n\n    function sweep() {\n      const count = game.stack.length;\n      const amplitude = Math.min(width / 2 - 72, 105 + count * 5.1);\n      const speed = Math.min(2.67, 1.04 + count * .055);\n      const phase = game.aim;\n      return { x: Math.sin(phase) * amplitude, vx: Math.cos(phase) * amplitude * speed * .16, speed };\n    }\n\n    function nextCake() {\n      const { x, vx } = sweep();\n      const count = game.stack.length;\n      return {\n        x, vx, y: target().y + 112 + game.lift,\n        radius: 76 - Math.min(13, count * .63), id: count,\n      };\n    }\n\n    function action() {\n      initAudio();\n      if (game.mode === 'flop') {\n        if (game.time >= game.endAt) reset();\n        return;\n      }\n      if (game.flight || game.time \u003c game.spawnAt) return;\n      game.mode = 'play';\n      game.flight = { ...nextCake(), vy: -45, age: 0 };\n      get('callout').hidden = true;\n      chime([[224, .14]], .05);\n    }\n\n    function scatter(x, y, perfect, count) {\n      const amount = reduceMotion ? 3 : (perfect ? 17 : 9);\n      for (let i = 0; i \u003c amount; i++) {\n        const angle = (i * 2.4 + count) % (Math.PI * 2);\n        game.crumbs.push({\n          x, y, vx: Math.cos(angle) * (19 + i * 6),\n          vy: 36 + (i * 71) % 92, age: 0, life: .43 + (i % 4) * .09,\n          size: i % 3 ? 2 : 4, color: perfect && i % 3 ? '#fff0a6' : '#bb642a', star: perfect && i % 2 === 0,\n        });\n      }\n    }\n\n    function flop(cake) {\n      game.mode = 'flop';\n      game.endAt = game.time + (reduceMotion ? .20 : .56);\n      game.flight = null;\n      game.streak = 0;\n      get('callout').hidden = true;\n      const direction = Math.sign(cake.x - target().x) || 1;\n      game.loose = [...game.stack, cake].map((part, i) => ({\n        ...part,\n        vx: direction * (26 + i * 15) + Math.sin(i * 5.7) * 36,\n        vy: 26 + (i * 41) % 100,\n        turn: Math.sin(i * 9.4) * .23,\n        spin: direction * (1.4 + i % 4 * .41),\n        age: 0,\n        delay: (game.stack.length - i) * .021,\n        bounce: 0,\n      }));\n      scatter(cake.x, cake.y + 9, false, cake.id);\n      chime([[149, .17], [105, .25]], .17, 'triangle');\n    }\n\n    function land(cake, on) {\n      const dx = cake.x - on.x;\n      const reach = (cake.radius + on.radius) * .47;\n      if (Math.abs(dx) > reach) {\n        flop(cake);\n        return;\n      }\n      const perfect = Math.abs(dx) \u003c Math.max(9, 17 - game.stack.length * .29);\n      const nearEdge = Math.abs(dx) > reach * .64;\n      const planted = {\n        ...cake, x: on.x + dx * (perfect ? .23 : .65), y: on.y, perfect,\n      };\n      const pile = [...game.stack, planted];\n      // The center of mass above each contact must still sit on the supporting pancake.\n      let carriedX = 0;\n      for (let i = pile.length - 1; i >= 0; i--) {\n        carriedX += pile[i].x;\n        const base = pile[i - 1] || { x: 0, radius: 93 };\n        if (Math.abs(carriedX / (pile.length - i) - base.x) > base.radius * .89) {\n          flop(cake);\n          return;\n        }\n      }\n      game.stack.push(planted);\n      game.flight = null;\n      game.lift = -cakeHeight * .75;\n      game.wobble = clamp(dx / 118, -.42, .42);\n      game.wobbleAge = 0;\n      game.spawnAt = game.time + .28;\n      game.streak = perfect ? game.streak + 1 : 0;\n      if (game.stack.length > game.best) {\n        game.best = game.stack.length;\n        write(scoreKey, game.best);\n      }\n      refreshScore();\n      scatter(planted.x, on.y + 15, perfect, cake.id);\n      if (perfect) {\n        const banner = game.streak >= 2 ? `Perfect ×${game.streak}` : 'Perfect!';\n        callout(banner, .83, true);\n        chime([[523 + game.streak * 21, .18], [784 + game.streak * 23, .25]], .12);\n      } else {\n        if (nearEdge) callout('Close catch!', .64);\n        chime([[179, .12], [315, .16]], .085, 'triangle');\n      }\n    }\n\n    function update(dt) {\n      game.time += dt;\n      game.aim += game.mode === 'flop' ? 0 : sweep().speed * dt;\n      game.lift *= Math.exp(-dt * 12);\n      game.wobbleAge += dt;\n      const top = target();\n      const idealCamera = Math.max(0, top.y - 240);\n      if (game.mode !== 'flop') game.camera = blend(game.camera, idealCamera, 1 - Math.exp(-dt * 6));\n      if (game.flight) {\n        const cake = game.flight;\n        const previousY = cake.y;\n        const previousX = cake.x;\n        cake.age += dt;\n        cake.vy -= gravity * dt;\n        cake.y += cake.vy * dt;\n        cake.x += cake.vx * dt;\n        if (cake.y \u003c= top.y) {\n          const across = clamp((previousY - top.y) / (previousY - cake.y), 0, 1);\n          cake.x = blend(previousX, cake.x, across);\n          cake.y = top.y;\n          land(cake, top);\n        }\n      }\n      if (game.mode === 'flop') {\n        for (const cake of game.loose) {\n          cake.age += dt;\n          if (cake.age \u003c cake.delay) continue;\n          cake.vy -= gravity * dt;\n          cake.y += cake.vy * dt;\n          cake.x += cake.vx * dt;\n          cake.turn += cake.spin * dt;\n          if (cake.y \u003c -16) {\n            cake.y = -16;\n            if (cake.bounce === 0) {\n              cake.vy = Math.abs(cake.vy) * .24;\n              cake.bounce++;\n            } else {\n              cake.vx *= Math.exp(-dt * 5.2);\n              cake.spin *= Math.exp(-dt * 8);\n            }\n          }\n        }\n        if (game.time >= game.endAt && get('end').hidden) {\n          const count = game.stack.length;\n          const record = game.best > game.startingBest;\n          get('end-title').textContent = record ? 'New best!' : 'Flop!';\n          get('end-score').textContent = count ? `${count} pancake${count === 1 ? '' : 's'} stacked.` : 'Aim for the center of the plate.';\n          get('end').hidden = false;\n          get('action-text').textContent = 'Play again';\n        }\n      }\n      for (const dot of game.crumbs) {\n        dot.x += dot.vx * dt;\n        dot.y += dot.vy * dt;\n        dot.age += dt;\n        dot.vy -= dt * 220;\n      }\n      game.crumbs = game.crumbs.filter((dot) => dot.age \u003c dot.life);\n      if (!get('callout').hidden && game.time > game.messageUntil) get('callout').hidden = true;\n    }\n\n    /* The kitchen is cached at device resolution. Pancakes and garnish are drawn separately. */\n    function ellipse(ctx, x, y, rx, ry, fill, stroke, weight = 1) {\n      ctx.beginPath();\n      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);\n      if (fill) { ctx.fillStyle = fill; ctx.fill(); }\n      if (stroke) { ctx.lineWidth = weight; ctx.strokeStyle = stroke; ctx.stroke(); }\n    }\n\n    function roundBox(ctx, x, y, w, h, r, fill, stroke, weight = 1) {\n      ctx.beginPath();\n      ctx.roundRect(x, y, w, h, r);\n      if (fill) { ctx.fillStyle = fill; ctx.fill(); }\n      if (stroke) { ctx.lineWidth = weight; ctx.strokeStyle = stroke; ctx.stroke(); }\n    }\n\n    function line(ctx, points, color, weight) {\n      ctx.beginPath();\n      ctx.moveTo(...points[0]);\n      points.slice(1).forEach((point) => ctx.lineTo(...point));\n      ctx.lineWidth = weight;\n      ctx.strokeStyle = color;\n      ctx.lineCap = 'round';\n      ctx.lineJoin = 'round';\n      ctx.stroke();\n    }\n\n    function linear(ctx, x0, y0, x1, y1, stops) {\n      const fill = ctx.createLinearGradient(x0, y0, x1, y1);\n      stops.forEach(([stop, value]) => fill.addColorStop(stop, value));\n      return fill;\n    }\n\n    function randomFrom(index) {\n      const x = Math.sin(index * 12.9898 + 71.163) * 43758.5453;\n      return x - Math.floor(x);\n    }\n\n    function drawKitchen() {\n      const ctx = screen.getContext('2d');\n      ctx.setTransform(sceneScale, 0, 0, sceneScale, 0, 0);\n      const floor = linear(ctx, 0, 328, 0, height, [[0, '#f3c998'], [.55, '#e6a879'], [1, '#bc7357']]);\n      ctx.fillStyle = linear(ctx, 0, 0, 0, 350, [[0, '#a3c4b5'], [.55, '#c9d6ad'], [1, '#a4b694']]);\n      ctx.fillRect(0, 0, width, height);\n      ctx.lineWidth = 1.25;\n      const tileSize = 62;\n      for (let y = -12; y \u003c 328; y += tileSize) {\n        for (let x = -12, i = 0; x \u003c width; x += tileSize, i++) {\n          const alpha = randomFrom(i + y) * .07;\n          roundBox(ctx, x, y, tileSize, tileSize, 3, `rgba(255,251,193,${alpha})`, '#76988a63', 1.1);\n          ctx.fillStyle = '#fff6cf21';\n          ctx.fillRect(x + 4, y + 3, tileSize - 7, 1);\n        }\n      }\n\n      const lampX = width * .175;\n      ctx.save();\n      ctx.globalAlpha = .28;\n      ctx.fillStyle = '#f7e7ad';\n      ctx.beginPath();\n      ctx.moveTo(lampX - 35, 40);\n      ctx.lineTo(lampX + 44, 40);\n      ctx.lineTo(lampX + 190, 329);\n      ctx.lineTo(lampX - 86, 329);\n      ctx.closePath();\n      ctx.fill();\n      ctx.restore();\n\n      const windowW = Math.min(142, width * .24);\n      const windowX = width * .08;\n      roundBox(ctx, windowX + 4, 23, windowW, 170, [60, 60, 7, 7], '#607f6a43');\n      roundBox(ctx, windowX, 17, windowW, 171, [60, 60, 7, 7], '#e7ebc8', '#82a18b', 1.5);\n      const glaze = linear(ctx, 0, 25, 0, 173, [[0, '#78aaab'], [.63, '#a5c8b7'], [1, '#e3de9f']]);\n      roundBox(ctx, windowX + 10, 28, windowW - 20, 149, [55, 55, 2, 2], glaze, '#658f87', 1.2);\n      ctx.save();\n      ctx.beginPath();\n      ctx.roundRect(windowX + 10, 28, windowW - 20, 149, [55, 55, 2, 2]);\n      ctx.clip();\n      ellipse(ctx, windowX + windowW * .62, 69, 18, 18, '#fff0b0');\n      ellipse(ctx, windowX + 18, 157, 66, 35, '#8eab83');\n      ellipse(ctx, windowX + 100, 153, 55, 45, '#a1b58a');\n      ellipse(ctx, windowX + 61, 172, 60, 26, '#719782');\n      ctx.fillStyle = '#fff9e03a';\n      ctx.beginPath();\n      ctx.moveTo(windowX + 8, 112);\n      ctx.lineTo(windowX + 80, 18);\n      ctx.lineTo(windowX + 105, 20);\n      ctx.lineTo(windowX + 16, 144);\n      ctx.fill();\n      ctx.restore();\n      line(ctx, [[windowX + windowW / 2, 24], [windowX + windowW / 2, 177]], '#e4e7c5', 6);\n      line(ctx, [[windowX + 9, 97], [windowX + windowW - 9, 97]], '#e4e7c5', 6);\n      roundBox(ctx, windowX - 5, 180, windowW + 10, 12, 3, '#e3e7bf', '#8fa587', 1.2);\n\n      if (width > 490) {\n        // Two shelves and a few muted shapes leave the center clear for the moving pan.\n        const shelfX = width - 119;\n        roundBox(ctx, shelfX, 179, 91, 8, 2, '#78967d');\n        roundBox(ctx, shelfX + 6, 145, 15, 33, 4, '#d9d7a9');\n        roundBox(ctx, shelfX + 7, 140, 13, 7, 2, '#ac784e');\n        roundBox(ctx, shelfX + 27, 155, 19, 23, 4, '#88a995');\n        roundBox(ctx, shelfX + 29, 152, 15, 6, 2, '#e7ddb4');\n        roundBox(ctx, shelfX + 54, 150, 23, 28, 4, '#e2a774');\n        roundBox(ctx, shelfX + 57, 145, 17, 8, 2, '#ac7049');\n        line(ctx, [[shelfX - 3, 185], [shelfX + 88, 185]], '#72928377', 2);\n      }\n\n      ctx.fillStyle = '#8ba486';\n      ctx.fillRect(0, 310, width, 22);\n      line(ctx, [[0, 313], [width, 313]], '#d3d9ae', 2);\n      line(ctx, [[0, 324], [width, 324]], '#6f8c75', 2);\n      ctx.fillStyle = floor;\n      ctx.fillRect(0, 328, width, height - 328);\n      ctx.save();\n      ctx.beginPath();\n      ctx.rect(0, 329, width, height - 329);\n      ctx.clip();\n      const py = [329, 343, 361, 383, 412, 449, 501];\n      const center = width / 2;\n      for (let row = 0; row \u003c py.length - 1; row++) {\n        const [a, b] = [py[row], py[row + 1]];\n        const top = 28 + (a - 329) * .43;\n        const b     osc.frequency.setValueAtTime(frequency,t);

function sweep() {
  if (selected === 'toast') {
    const amplitude = Math.min(width * .29, round.turn <= 1 ? 116 : 139 + round.score * 2.9);

function step(dt) {

    const y=toastLandingY-Math.sin(Math.PI*t)*13*(1-t);
    toast(c,round.catchX,y,round.fly.radius,.23+t*.39,round.turn);
    if(round.score>1) glint(c,plateX+60,toastLandingY-24,9,'#fff2c7');
  } else {
    const f=round.fly;
    toast(c,f.x,f.y,f.radius,reduced?0:f.angle,round.turn);
  }
}

function drawCookie(c) {
  const [x,r]=[round.goal,mugRadius()];
  mug(c,x,mugY,r,false,Math.floor(round.score/3));
  if(round.mode==='ready') {
    const motion=sweep();
    const y=104+Math.cos(round.phase)*10;
    const duration=(Math.sqrt(15**2+2*780*(mugY-12-y))-15)/780;
    const aim=motion.x+duration*motion.vx;
    const valid=Math.abs(aim-x)<=r-cookieRadius()*.72-6;
    if(round.score<2) {
      c.save(); c.setLineDash([2,6]);
      line(c,'#695473ad',1.6,[motion.x+6,y+29],[aim,mugY-11]);
      c.restore();
    }
    ellipse(c,aim,mugY+2,12,4,valid?'#6e95775b':'#a94d5b46',valid?'#587a5c':'#9d4b56',1.2);
    c.save(); c.globalAlpha=.68;
    line(c,'#6a4b6d',1.6,[0,-42],[motion.x,y-19]);
    c.restore();
    cookie(c,motion.x,y,cookieRadius(),Math.sin(round.phase)*.24,round.turn+2);
  } else if(round.mode==='landed') {
    const t=clamp((round.nextAt-clock)/.58,0,1);
    ellipse(c,round.catchX,mugY+1,9+(1-t)*20,3+(1-t)*4,null,`rgba(255,246,220,${t})`,2);
  } else {
    const f=round.fly;
    cookie(c,f.x,f.y,f.radius,reduced?0:f.angle,round.turn+2);
  }
  mug(c,x,mugY,r,true,Math.floor(round.score/3));
}

function draw() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(background,0,0);
  ctx.setTransform(resolution,0,0,resolution,width*resolution/2,0);
  if(selected==='toast') drawToast(ctx);
  else drawCookie(ctx);
  for(const p of round.pieces) {
    ctx.save(); ctx.globalAlpha=1-p.age/p.life;
    if(p.star) glint(ctx,p.x,p.y,p.size*1.6,p.color);
    else ellipse(ctx,p.x,p.y,p.size,p.size*.62,p.color);
    ctx.restore();
  }
}

function fitGame() {
  if(!guide[selected]) return;
  const rect=canvas.getBoundingClientRect();
  if(!rect.width||!rect.height) return;
  const pixelRatio=Math.min(devicePixelRatio,2);
  canvas.width=Math.round(rect.width*pixelRatio);
  canvas.height=Math.round(rect.height*pixelRatio);
  resolution=canvas.height/arena;
  width=canvas.width/resolution;
  background.width=canvas.width;
  background.height=canvas.height;
  const bg=background.getContext('2d');
  bg.setTransform(resolution,0,0,resolution,0,0);
  kitchen(bg,width,arena,selected);
  draw();
}
function animate(now) {
  raf=0;
  if(!guide[selected]) return;
  const dt=lastFrame===undefined?0:clamp((now-lastFrame)/1000,0,.045);
  lastFrame=now;
  step(dt); draw();
  raf=requestAnimationFrame(animate);
}

function drawCover(card) {
  const art=card.querySelector('canvas');
  const kind=card.dataset.game;
  const {width:pw,height:ph}=art.getBoundingClientRect();
  if(!pw||!ph) return;
  const pixelRatio=Math.min(devicePixelRatio,2);
  art.width=Math.round(pw*pixelRatio);
  art.height=Math.round(ph*pixelRatio);
  const c=art.getContext('2d');
  const scale=art.height/250;
  const w=art.width/scale;
  const h=250;
  c.setTransform(scale,0,0,scale,0,0);
  kitchen(c,w,h,kind,true);
  const cx=w*.53;
  if(kind==='pancake'){
    plate(c,cx,203,92);
    for(let i=0;i<6;i++) {
      pancake(c,cx+Math.sin(i*1.72)*5,191-i*13,63-i*.69,i===5);
    }
    glint(c,cx+80,88,13,'#fff5c9');
    glint(c,cx-68,102,8,'#fff5c9');
    for(let i=0;i<4;i++) ellipse(c,cx+65+i*4,200+(i%2)*3,4,3.8,'#655570','#493a51');
  } else if(kind==='toast'){
    plate(c,cx+42,203,65);
    toaster(c,cx-55,166,124);
    toast(c,cx-32,98,34,-.27,3);
    toast(c,cx+52,110,50,.31,8);
    line(c,'#a45e4370',2,[cx+4,137],[cx-9,151]);
    line(c,'#a45e4370',2,[cx+19,158],[cx+12,170]);
    glint(c,cx+105,74,13,'#fff5cf');
  } else {
    c.save(); c.translate(cx+16,132); c.scale(.95,.83);
    mug(c,0,0,60,false,0);
    mug(c,0,0,60,true,0);
    c.restore();
    cookie(c,cx-20,82,45,-.31,6);
    glint(c,cx+84,85,13,'#fff5cf');
    glint(c,cx-70,141,8,'#fff5cf');
    for(let i=0;i<9;i++) {
      const anchor=cx+17+Math.cos(i*1.5)*(23+i*2);
      const y=128-Math.sin(i*1.71)**2*(20+i*1.6);
      ellipse(c,anchor,y,2.6,3.6,'#fff2c9');
    }
  }
}
function refreshCovers() {
  if(!selected) covers.forEach(drawCover);
}
function moveFocus(element) {
  try { element.focus({preventScroll:true}); } catch {}
}
function showLibrary() {
  if(!selected) return;
  if(raf) cancelAnimationFrame(raf);
  raf=0;
  if(frameElement) {
    frameElement.remove();
    frameElement=undefined;
  }
  selected=undefined;
  $('play').hidden=true;
  $('pancake').hidden=true;
  $('arcade').hidden=false;
  window.scrollTo(0,0);
  refreshBests();
  refreshCovers();
  if(previousCard) moveFocus(previousCard);
}
function choose(card) {
  previousCard=card;
  selected=card.dataset.game;
  $('arcade').hidden=true;
  window.scrollTo(0,0);
  if(selected==='pancake'){
    frameElement=document.createElement('iframe');
    frameElement.id='pancake-frame';
    frameElement.title='Pancake Tower';
    frameElement.srcdoc=pancakeDocument.replace('0 /* STARTING BEST */', String(best('pancake')));
    $('pancake').hidden=false;
    $('pancake').append(frameElement);
    return;
  }
  const meta=guide[selected];
  soundOn = read('breakfast-arcade-sound-v1') === 'on';
  useSound();
  $('play').hidden=false;
  $('play').dataset.game=selected;
  $('game-title').innerHTML=meta.title;
  $('game-description').textContent=meta.instruction;
  $('score-title').textContent=meta.counter;
  canvas.setAttribute('aria-label',`${meta.label}. Press Space or tap to play.`);
  lastFrame=undefined;
  clock=0;
  newRun();
  fitGame();
  moveFocus($('action'));
  raf=requestAnimationFrame(animate);
}
covers.forEach((card)=>card.addEventListener('click',()=>choose(card)));
$('back').addEventListener('click',showLibrary);
$('action').addEventListener('click',act);
$('again').addEventListener('click',act);
$('sound').addEventListener('click',()=>{
  soundOn=!soundOn; save('breakfast-arcade-sound-v1',soundOn?'on':'off');
  useSound(); enableAudio();
  if(soundOn && audio) audio.resume().then(()=>notes([392,523,659])).catch(()=>{});
});
canvas.addEventListener('pointerdown',(event)=>{if(event.button===0) act();});
$('end').addEventListener('pointerdown',(event)=>{if(event.target===$('end')) act();});
window.addEventListener('keydown',(event)=>{
  if(event.code==='Escape' && selected){event.preventDefault(); showLibrary(); return;}
  if(!guide[selected] || event.code!=='Space' || event.altKey || event.metaKey || event.ctrlKey || event.shiftKey) return;
  if(event.target===$('sound') || event.target===$('back')) return;
  event.preventDefault();
  if(!event.repeat) act();
});
window.addEventListener('message',(event)=>{
  if(!frameElement||event.source!==frameElement.contentWindow||event.data?.type!=='breakfast-arcade-return') return;
  if(Number.isFinite(event.data.best) && event.data.best > best('pancake')) save(keys.pancake,event.data.best);
  showLibrary();
});
new ResizeObserver(fitGame).observe($('stage'));
new ResizeObserver(refreshCovers).observe($('arcade'));
document.addEventListener('visibilitychange',()=>{lastFrame=undefined;});
refreshBests();
useSound();
refreshCovers();
</script>
